name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing commit, tag or branch to prepare without publishing'
        type: string
        required: true
        default: dev
      differential:
        description: 'Compare with the pinned upstream implementation'
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate tag and resolve candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python scripts/publish-release.py check-tag --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      artifacts: true
      differential: ${{ github.event_name == 'push' || inputs.differential }}

  publish:
    if: github.event_name == 'push' && github.event.created
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: jx-*
          path: dist
          merge-multiple: true
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: python scripts/publish-release.py publish --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --artifacts dist
