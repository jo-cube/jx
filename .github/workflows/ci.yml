name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p jx -p jx-cli --no-default-features --locked
      - run: cargo build --workspace --release --locked
      - run: cargo bench -p jx --bench throughput --all-features --locked -- --smoke
      - run: cargo bench -p jx --bench throughput --features jit --locked -- --smoke
        env:
          JX_BENCH_NATIVE_ONLY: '1'
          JX_BENCH_NATIVE: '1'
