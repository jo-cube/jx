name: Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15-intel, windows-2022]
        features: [default, native]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - if: matrix.features == 'default'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: matrix.features == 'default'
        run: cargo test --locked
      - if: matrix.features == 'default'
        run: cargo build --release --locked
      - if: matrix.features == 'default'
        run: cargo bench -p jx --bench throughput --locked -- --smoke
      - if: matrix.features == 'native'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: matrix.features == 'native'
        run: cargo test --workspace --all-features --locked
      - if: matrix.features == 'native'
        run: cargo build -p jx-cli --features jit --release --locked
      - if: matrix.features == 'native'
        run: cargo bench -p jx --bench throughput --features jit --locked -- --smoke
        env:
          JX_BENCH_NATIVE_ONLY: '1'
          JX_BENCH_NATIVE: '1'
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo package --workspace --locked
      - run: cargo doc -p jx --no-deps --locked
        env:
          RUSTDOCFLAGS: '-D warnings'
