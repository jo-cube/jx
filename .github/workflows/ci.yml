name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      differential:
        description: 'Compare with the pinned upstream implementation'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      artifacts:
        type: boolean
        default: false
      differential:
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve candidate revision
        id: revision
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: repository-checks
      - name: Formatting and strict Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Archive tooling and extracted source packages
        run: |
          python -m unittest discover -s scripts/tests
          cargo package --workspace --all-features --locked
      - name: Rustdoc and guide examples
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: |
          cargo doc -p jx --no-deps --locked
          python scripts/check-guides.py
      - name: Allocation and execution smoke checks
        run: cargo bench -p jx --bench throughput --all-features --locked -- --smoke
      - if: inputs.differential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsonata-js/jsonata
          ref: 8ee4476f8a228bfc7a62979ae0a9c13a4043cd03
          path: target/jsonata-reference
          persist-credentials: false
      - if: inputs.differential
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Optional upstream differential checks
        if: inputs.differential
        run: |
          cargo build -p jx-cli --release --locked
          for suite in scripts/check-*.cjs; do
            node "$suite" target/jsonata-reference target/release/jx
          done

  platforms:
    name: ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - name: Reproducible build settings
        run: |
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          printf 'RUSTFLAGS=--remap-path-prefix=%s=.\n' "$(python -c 'import os; print(os.getcwd())')" >> "$GITHUB_ENV"
      - name: Default tests and release build
        run: |
          cargo test -p jx -p jx-cli --locked --target ${{ matrix.target }}
          cargo build -p jx-cli --release --locked --target ${{ matrix.target }}
      - name: Default archive and extracted CLI
        run: |
          archive="$(python scripts/package-release.py --target ${{ matrix.target }})"
          python scripts/smoke-release.py "$archive" --revision "$(git rev-parse HEAD)"
      - name: Upload verified archives
        if: inputs.artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
