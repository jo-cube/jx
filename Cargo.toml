[workspace]
members = ["crates/jx", "crates/jx-cli"]
default-members = ["crates/jx", "crates/jx-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/jo-cube/jx"
homepage = "https://github.com/jo-cube/jx"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
